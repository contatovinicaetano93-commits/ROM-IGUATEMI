name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um PR que recebe vários pushes seguidos cancela as execuções antigas.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Não bloqueia (ainda): o main já entra aqui com 28 erros herdados,
      # quase todos set-state-in-effect / no-explicit-any / no-unused-vars,
      # espalhados por muitos arquivos. Bloquear hoje deixaria todo PR vermelho.
      # Zerado esse passivo, troque para bloqueante removendo o continue-on-error.
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          # O build não fala com banco nem com a Avec; estes valores existem só
          # para satisfazer a leitura de env em tempo de import. Nunca aponte
          # para um banco real aqui.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          ROM_SESSION_SECRET: ci-placeholder-nao-usar-em-producao
          CRON_SECRET: ci-placeholder-nao-usar-em-producao
          ROM_PANEL: iguatemi
          NEXT_PUBLIC_ROM_PANEL: iguatemi
          AVEC_UNIT_ID: "0"
